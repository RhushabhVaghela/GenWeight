[project]
name = "genweight"
version = "0.1.0"
description = "Research framework for studying transformer weight geometry"
requires-python = ">=3.12"

dependencies = [
    "torch",
    "transformers",
    "numpy",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "pandas",
    "tqdm"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["genweight"]